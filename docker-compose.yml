services:

  postgres:
    image: postgres:17
    container_name: restaurantesdb

    environment:
      POSTGRES_DB: ${DATASOURCE_DB}
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATASOURCE_USERNAME} -d ${DATASOURCE_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  restaurantes-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: restaurantes-api

    ports:
      - "8080:8080"

    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DATASOURCE_DB}
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: